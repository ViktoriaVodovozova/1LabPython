{% extends "base.html" %}

{% block content %}
    <section class="users">
        <h2>Список пользователей</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% if users %}
                    {% for user in users %}
                        <tr>
                            <td>{{ user.id }}</td>
                            <td>{{ user.name }}</td>
                            <td><a href="/user?id={{ user.id }}">Подробнее</a></td>
                        </tr>
                    {% endfor %}
                {% else %}
                    <tr>
                        <td colspan="3">Нет пользователей в системе</td>
                    </tr>
                {% endif %}
            </tbody>
        </table>

        <div class="actions">
            <p>Всего пользователей: {{ users|length }}</p>
        </div>
    </section>
{% endblock %}
